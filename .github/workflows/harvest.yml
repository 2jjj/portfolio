name: colheita

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: colheita
        run: node scripts/harvest.mjs

      - name: commit dos JSONs
        run: |
          if git diff --quiet -- public; then
            echo "nada novo para publicar"
            exit 0
          fi
          git config user.name "colheita-bot"
          git config user.email "colheita-bot@users.noreply.github.com"
          git add public/jobs.json public/freelance.json
          git commit -m "chore(vagas): colheita automatica"
          git push
